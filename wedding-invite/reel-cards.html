<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,initial-scale=1">
<title>Veeral &amp; Konika — Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f4f0e4}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;color:#355343;background:radial-gradient(ellipse at 50% 34%,#fffdf5 0,#f8f5eb 56%,#e9ede0 100%);font-family:'Cormorant Garamond',serif}
.paper{position:absolute;inset:0;width:100%;height:100%;opacity:.26;mix-blend-mode:multiply;pointer-events:none}
.botanical{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.border{position:absolute;inset:34px;border:1px solid rgba(93,126,96,.42);border-radius:46% 46% 18px 18px / 5% 5% 18px 18px;box-shadow:inset 0 0 0 8px rgba(255,255,245,.48),inset 0 0 0 10px rgba(161,171,129,.25);pointer-events:none}
.border:before,.border:after{position:absolute;left:50%;transform:translateX(-50%);color:#ba8b4f;content:'✿  ·  ✧  ·  ✿';font:22px 'Cormorant Garamond',serif;letter-spacing:.25em;background:#f7f4e9;padding:0 22px}.border:before{top:-12px}.border:after{bottom:-13px}
.wash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 42%,rgba(102,126,89,.08) 100%)}
.eyebrow{position:absolute;top:200px;width:100%;text-align:center;font:500 23px 'Cinzel',serif;letter-spacing:.28em;color:#687e61;opacity:0}
.headline{position:absolute;top:270px;width:100%;text-align:center;font:500 60px 'Great Vibes',cursive;color:#3f6048;opacity:0;text-shadow:0 1px rgba(255,255,255,.9)}
.couple{position:absolute;left:50%;top:490px;height:850px;width:auto;max-width:90%;object-fit:contain;opacity:0;transform:translate(-50%,70px) scale(.94);filter:drop-shadow(0 14px 15px rgba(58,76,55,.19));will-change:transform,opacity}
.card{position:absolute;top:850px;width:360px;height:202px;background:linear-gradient(145deg,#fffef8,#f4f0e4);border:1px solid #b9995e;outline:1px solid rgba(255,255,255,.9);outline-offset:-8px;box-shadow:0 12px 22px rgba(56,70,46,.18);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;will-change:transform,opacity}
.card:before{content:'✧';position:absolute;top:11px;color:#ba9254;font-size:18px}.card:after{content:'';position:absolute;left:22px;right:22px;bottom:19px;border-top:1px solid rgba(161,132,79,.42)}
#save{left:150px;transform:translate(-520px,-20px) rotate(-7deg)}
#thedate{left:570px;transform:translate(520px,20px) rotate(7deg)}
.card-main{font:700 51px 'Cinzel',serif;letter-spacing:.12em;color:#42664d;line-height:1}
.card-sub{margin-top:10px;font:italic 19px 'Cormorant Garamond',serif;letter-spacing:.12em;color:#9d7441}
.info{position:absolute;left:128px;right:128px;top:1340px;height:340px;border:1px solid rgba(177,145,86,.75);background:rgba(255,253,245,.88);box-shadow:0 10px 24px rgba(67,79,52,.11);text-align:center;opacity:0;transform:translateY(34px);will-change:transform,opacity}
.info:before{content:'';position:absolute;inset:8px;border:1px solid rgba(177,145,86,.35);pointer-events:none}
.info-kicker{position:relative;margin-top:38px;font:500 19px 'Cinzel',serif;letter-spacing:.2em;color:#738566}
.names{position:relative;margin-top:5px;font:500 56px 'Great Vibes',cursive;color:#395c42;line-height:1.08}
.date{position:relative;margin-top:9px;font:600 31px 'Cinzel',serif;letter-spacing:.11em;color:#895e32}
.venue{position:relative;margin-top:10px;font:500 24px 'Cormorant Garamond',serif;letter-spacing:.12em;color:#526e54}
.tail{position:relative;margin-top:12px;font:italic 22px 'Cormorant Garamond',serif;color:#8b704f}
.petal{position:absolute;top:-90px;width:13px;height:20px;border-radius:80% 10% 80% 10%;background:#d98677;opacity:.8;will-change:transform}
.petal:nth-child(3n){background:#d4b26e;width:10px;height:16px}.petal:nth-child(3n+1){background:#8eaa83;width:12px;height:18px}
</style>
</head>
<body><main id="stage">
  <svg class="botanical" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9eb495"/><stop offset="1" stop-color="#55785b"/></linearGradient>
      <linearGradient id="leaf2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7dfc8"/><stop offset="1" stop-color="#779478"/></linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation=".65"/></filter>
    </defs>
    <g fill="none" stroke="#70896b" stroke-width="4" opacity=".82">
      <path d="M-25 85 C125 210 30 360 154 515 S40 790 138 960 S36 1225 142 1395 S38 1650 135 1870"/>
      <path d="M1105 75 C960 205 1050 355 930 520 S1047 790 945 965 S1048 1225 940 1400 S1045 1645 944 1870"/>
    </g>
    <g fill="url(#leaf)" stroke="#637f62" stroke-width="2" opacity=".87">
      <path d="M48 225 C-15 175 -8 120 63 151 C95 177 78 209 48 225Z"/><path d="M90 260 C155 203 199 228 155 285 C127 303 105 282 90 260Z"/>
      <path d="M112 475 C42 438 41 380 112 399 C145 420 138 453 112 475Z"/><path d="M83 565 C143 500 192 523 149 582 C124 602 102 584 83 565Z"/>
      <path d="M80 778 C14 740 17 685 84 702 C119 720 108 754 80 778Z"/><path d="M100 910 C165 850 211 877 163 930 C135 952 116 933 100 910Z"/>
      <path d="M86 1130 C19 1082 27 1029 92 1050 C125 1074 113 1107 86 1130Z"/><path d="M97 1286 C162 1227 210 1253 164 1309 C133 1332 112 1313 97 1286Z"/>
      <path d="M88 1510 C20 1471 23 1412 91 1434 C123 1456 116 1488 88 1510Z"/><path d="M96 1673 C159 1612 207 1639 162 1696 C133 1717 111 1698 96 1673Z"/>
    </g>
    <g fill="url(#leaf2)" stroke="#809579" stroke-width="2" opacity=".82" transform="translate(1080 0) scale(-1 1)">
      <path d="M48 225 C-15 175 -8 120 63 151 C95 177 78 209 48 225Z"/><path d="M90 260 C155 203 199 228 155 285 C127 303 105 282 90 260Z"/>
      <path d="M112 475 C42 438 41 380 112 399 C145 420 138 453 112 475Z"/><path d="M83 565 C143 500 192 523 149 582 C124 602 102 584 83 565Z"/>
      <path d="M80 778 C14 740 17 685 84 702 C119 720 108 754 80 778Z"/><path d="M100 910 C165 850 211 877 163 930 C135 952 116 933 100 910Z"/>
      <path d="M86 1130 C19 1082 27 1029 92 1050 C125 1074 113 1107 86 1130Z"/><path d="M97 1286 C162 1227 210 1253 164 1309 C133 1332 112 1313 97 1286Z"/>
      <path d="M88 1510 C20 1471 23 1412 91 1434 C123 1456 116 1488 88 1510Z"/><path d="M96 1673 C159 1612 207 1639 162 1696 C133 1717 111 1698 96 1673Z"/>
    </g>
    <g fill="#df9b8c" opacity=".87">
      <g transform="translate(98 342)"><circle r="13"/><circle cx="18" cy="-5" r="12"/><circle cx="15" cy="14" r="12"/><circle cx="-7" cy="18" r="12"/><circle cx="-18" cy="0" r="12"/><circle r="5" fill="#d0aa62"/></g>
      <g transform="translate(976 720)"><circle r="13"/><circle cx="18" cy="-5" r="12"/><circle cx="15" cy="14" r="12"/><circle cx="-7" cy="18" r="12"/><circle cx="-18" cy="0" r="12"/><circle r="5" fill="#d0aa62"/></g>
      <g transform="translate(105 1350)"><circle r="13"/><circle cx="18" cy="-5" r="12"/><circle cx="15" cy="14" r="12"/><circle cx="-7" cy="18" r="12"/><circle cx="-18" cy="0" r="12"/><circle r="5" fill="#d0aa62"/></g>
      <g transform="translate(978 1570)"><circle r="13"/><circle cx="18" cy="-5" r="12"/><circle cx="15" cy="14" r="12"/><circle cx="-7" cy="18" r="12"/><circle cx="-18" cy="0" r="12"/><circle r="5" fill="#d0aa62"/></g>
    </g>
  </svg>
  <svg class="paper" viewBox="0 0 180 180" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain)" opacity=".28"/></svg>
  <div class="border"></div><div class="wash"></div>
  <div class="eyebrow" id="eyebrow">A LITTLE ANNOUNCEMENT</div>
  <div class="headline" id="headline">Our favourite date is almost here</div>
  <img class="couple" id="couple" src="codex/out/01_anchor_couple.png">
  <div class="card" id="save"><div class="card-main">SAVE</div><div class="card-sub">KONIKA'S CARD</div></div>
  <div class="card" id="thedate"><div class="card-main" style="font-size:43px">THE DATE</div><div class="card-sub">VEERAL'S CARD</div></div>
  <section class="info" id="info">
    <div class="info-kicker">THE WEDDING OF</div>
    <div class="names">Veeral <span style="font:500 30px 'Cormorant Garamond',serif;color:#b28a51">&amp;</span> Konika</div>
    <div class="date">19 — 21 NOVEMBER 2026</div>
    <div class="venue">RUNICHA DHAM · BALOTRA, RAJASTHAN</div>
    <div class="tail">Three days · one beautiful beginning</div>
  </section>
  <div id="petals"></div>
</main>
<script>
const D=10,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const el=id=>document.getElementById(id);
for(let i=0;i<24;i++){const p=document.createElement('i');p.className='petal';p.dataset.i=i;el('petals').append(p)}
window.__DURATION=D;
window.__seek=t=>{
  t=clamp(t,0,D);
  const show=ease((t-.2)/.7);
  el('eyebrow').style.opacity=show;
  el('headline').style.opacity=ease((t-.5)/.8);
  const cp=ease((t-.8)/1.1);
  el('couple').style.opacity=cp;
  el('couple').style.transform=`translate(-50%,${70*(1-cp)}px) scale(${.94+.06*cp})`;
  const cards=ease((t-2)/.8);
  el('save').style.opacity=cards;el('save').style.transform=`translate(${ -520*(1-cards)}px,${-20*(1-cards)}px) rotate(${-7*(1-cards)}deg)`;
  el('thedate').style.opacity=cards;el('thedate').style.transform=`translate(${520*(1-cards)}px,${20*(1-cards)}px) rotate(${7*(1-cards)}deg)`;
  const inf=ease((t-4.1)/.9);
  el('info').style.opacity=inf;el('info').style.transform=`translateY(${34*(1-inf)}px)`;
  for(const p of document.querySelectorAll('.petal')){const i=+p.dataset.i,phase=(t*.12+i/24)%1,x=(i*163)%1080+Math.sin(t*.6+i)*35;p.style.transform=`translate(${x}px,${phase*2030-50}px) rotate(${phase*460+i*39}deg)`;p.style.opacity=.52*Math.sin(Math.PI*phase)}
};
window.__seek(0);
</script>
</body></html>
