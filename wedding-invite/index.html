<!doctype html>
<html lang="hi">

<style>

    --ivory: #fff4dc;
    --maroon: #5a0f1f;
    --ink: #3a0612;

    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: #1a0509; transform-origin: 0 0; perspective: 2600px;
  }
  .slide { position: absolute; inset: 0; display: none; }
  .abs { position: absolute; }

  .hi { font-family: 'Rozha One', serif; font-weight: 400; }
  .tiro { font-family: 'Tiro Devanagari Hindi', serif; }
  .cinzel { font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase; }
  .script { font-family: 'Great Vibes', cursive; }
  .corm { font-family: 'Cormorant Garamond', serif; }
  .ivory { color: var(--ivory); text-shadow: 0 2px 6px rgba(20,0,5,.7); }
  .gold {
    background: linear-gradient(180deg, #fff3c4 0%, #f6d26b 38%, #c9973a 72%, #8a5a12 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .shadow { filter: drop-shadow(0 -1px 0 rgba(255,244,220,.55)) drop-shadow(0 3px 0 rgba(40,0,10,.8)) drop-shadow(0 8px 18px rgba(20,0,6,.55)); }
  .pattern { position: absolute; inset: 0; opacity: .085; background-size: 120px 120px; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(10,0,4,.65) 100%); }
  svg { overflow: visible; }
  .ribbon {
    position: absolute; left: 190px; width: 700px; height: 104px;
    background: linear-gradient(180deg, #fff1b8 0%, #f2c75c 45%, #c98f2c 100%);
    clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%);
    display: flex; align-items: center; justify-content: center; gap: 18px; color: var(--maroon);
  }
  .ribbon::before { content: ''; position: absolute; inset: 8px 46px; border-top: 2px solid rgba(90,15,31,.45); border-bottom: 2px solid rgba(90,15,31,.45); }
  .ribbon .t { font-family: 'Rozha One', serif; font-size: 70px; line-height: 1; margin-top: 10px; }
  .ribbon .w { font-family: 'Tiro Devanagari Hindi', serif; font-size: 38px; margin-top: 10px; }
  .daylist { position: absolute; left: 150px; width: 780px; }
  .daylist .row {
    display: flex; align-items: baseline; gap: 14px; font-size: 40px; height: 58px;
    font-family: 'Tiro Devanagari Hindi', serif; color: var(--ivory); text-shadow: 0 2px 6px rgba(20,0,5,.7);
  }
  .daylist .row .dots { flex: 1; border-bottom: 3px dotted rgba(246,212,111,.55); transform: translateY(-10px); }
  .daylist .row .tm { font-family: 'Rozha One', serif; color: #f8d978; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #doors { perspective: 2400px; }
  #doors > div { backface-visibility: hidden; }
  #playHint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 10;
    font: 600 22px 'Cormorant Garamond', serif; color: #fff4dc; background: rgba(90,15,31,.85);
    border: 2px solid #f2c75c; border-radius: 40px; padding: 14px 30px; cursor: pointer;
  }
</style>
</head>
<body>

<script>
/* ============================================================
   Veeral weds Konika — animated Rajasthani wedding invite
   Every frame is a pure function of time t (seconds): seek(t).
   tools/render.mjs steps through it frame by frame to make the MP4.
   ============================================================ */
const W = 1080, H = 1920, XF = 0.625;  // one beat at 96 BPM
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out: p => 1 - Math.pow(1 - p, 3),
  out5: p => 1 - Math.pow(1 - p, 5),
  inout: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ------------------------------------------------------------
   Content
   ------------------------------------------------------------ */
const DAYS = [
  { hi: 'प्रथम दिवस', num: '१', en: 'Day One', date: 'गुरुवार, 19 नवम्बर 2026', dateEn: 'Thursday · 19 November 2026', couple: 'traditional', theme: 'maroon' },
  { hi: 'द्वितीय दिवस', num: '२', en: 'Day Two', date: 'शुक्रवार, 20 नवम्बर 2026', dateEn: 'Friday · 20 November 2026', couple: 'casual', theme: 'teal' },
  { hi: 'तृतीय दिवस', num: '३', en: 'Day Three', date: 'शनिवार, 21 नवम्बर 2026', dateEn: 'Saturday · 21 November 2026', couple: 'traditional', theme: 'red' },
];
const EVENTS = [
  { day: 0, hi: 'गणेश स्थापना', en: 'Ganesh Sthapana', when: 'दोपहर', time: '12:05', tail: 'बजे', desc: 'विघ्नहर्ता श्री गणेश जी की स्थापना के साथ<br>मंगल उत्सव का शुभारम्भ', icon: 'ganesh', theme: 'saffron', fx: 'petals' },
  { day: 0, hi: 'मायरा स्वागत', en: 'Mayra Swagat', when: 'शाम', time: '4:15', tail: 'बजे', desc: 'ननिहाल से आए स्नेह भरे मायरे का<br>भावभीना स्वागत', icon: 'mayra', theme: 'rani', fx: 'rose' },
  { day: 0, hi: 'रिंग सेरेमनी', en: 'Ring Ceremony', when: 'शाम', time: '7:15', tail: 'बजे', desc: 'अंगूठियों के आदान-प्रदान संग<br>प्रेम के पहले वचन', icon: 'ring', theme: 'royal', fx: 'sparkle' },
  { day: 1, hi: 'कार्निवल', en: 'Carnival', when: 'सुबह', time: '8:00', tail: 'बजे', desc: 'मज़ेदार खेलों और हँसी-ठिठोली से भरी<br>एक खुशनुमा सुबह', icon: 'carnival', theme: 'teal', fx: 'confetti' },
  { day: 1, hi: 'बंदोली', en: 'Bandoli', when: 'शाम', time: '4:00', tail: 'बजे', desc: 'ढोल-नगाड़ों की थाप पर<br>नाचती-गाती बंदोली', icon: 'dhol', theme: 'marigold', fx: 'petals' },
  { day: 1, hi: 'संगीत संध्या', en: 'Sangeet Sandhya', when: 'शाम', time: '7:00', tail: 'बजे', desc: 'सुरों, गीतों और नृत्य से सजी<br>एक यादगार शाम', icon: 'sangeet', theme: 'purple', fx: 'notes' },
  { day: 1, hi: 'घड़ी विनायक', en: 'Ghadi Vinayak', when: 'रात', time: '12:15', tail: 'बजे', desc: 'शुभ घड़ी में श्री विनायक पूजन<br>एवं मंगल कामना', icon: 'clock', theme: 'night', fx: 'stars' },
  { day: 2, hi: 'हल्दी एवं जनेऊ', en: 'Haldi & Janeu', when: 'सुबह', time: '8:00', tail: 'बजे', desc: 'हल्दी के पीले रंग और<br>जनेऊ संस्कार की पावन रस्म', icon: 'haldi', theme: 'haldi', fx: 'haldi' },
  { day: 2, hi: 'बारात प्रस्थान', en: 'Baraat Prasthan & Bandoli', when: 'दोपहर', time: '3:00', tail: 'बजे', desc: 'बंदोली संग सजी-धजी बारात का<br>धूमधाम से प्रस्थान', icon: 'safa', theme: 'red', fx: 'confetti' },
  { day: 2, hi: 'मंगल फेरा', en: 'Mangal Phera', when: 'रात्रि', time: '7:21 – 9:34', tail: 'बजे तक', desc: 'अग्नि को साक्षी मानकर<br>सात जन्मों का पवित्र बंधन', icon: 'agni', theme: 'fire', fx: 'embers' },
];
// background (bg light, bg dark) and arch interior (light, dark) per theme
const THEMES = {
  maroon:   { bg: ['#7a1430', '#2c040f'], arch: ['#ffd9a0', '#b8452e'] },
  saffron:  { bg: ['#8a2a0a', '#330806'], arch: ['#ffd27a', '#d4500f'] },
  rani:     { bg: ['#8c1046', '#33031a'], arch: ['#ffb3d1', '#b0175d'] },
  royal:    { bg: ['#5c1035', '#1c0412'], arch: ['#f3c6d3', '#7d1d45'] },
  teal:     { bg: ['#0e4d4a', '#04201f'], arch: ['#bfe3d6', '#1d5e58'] },
  marigold: { bg: ['#93430a', '#361402'], arch: ['#ffe39a', '#e0790f'] },
  purple:   { bg: ['#4a1550', '#1a0520'], arch: ['#e9c7e6', '#6a2470'] },
  night:    { bg: ['#1b1a3a', '#07061a'], arch: ['#c9c3ea', '#2e2a63'] },
  haldi:    { bg: ['#9a6b00', '#3a2400'], arch: ['#fff6a8', '#e7a600'] },
  red:      { bg: ['#94101c', '#320306'], arch: ['#ffb0a8', '#b3141f'] },
  fire:     { bg: ['#7a1a02', '#240300'], arch: ['#ffd36a', '#c22a06'] },
};
const COUPLES = {
  casual: { src: 'assets/caricature_casual.png', w: 1040, h: 1291 },
  traditional: { src: 'assets/caricature_traditional.png', w: 747, h: 1540 },
};

/* ------------------------------------------------------------
   SVG ornaments
   ------------------------------------------------------------ */
const JAALI = `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='#f3cf6b' stroke-width='1.6'><path d='M60 8 L73 47 L112 60 L73 73 L60 112 L47 73 L8 60 L47 47Z'/><circle cx='60' cy='60' r='13'/><circle cx='0' cy='0' r='24'/><circle cx='120' cy='0' r='24'/><circle cx='0' cy='120' r='24'/><circle cx='120' cy='120' r='24'/><circle cx='60' cy='60' r='3' fill='#f3cf6b'/></g></svg>`)}")`;

function petal(len, wid) { // pointed petal from origin pointing up (-y)
  return `M0 0 Q${wid} ${-len * .45} 0 ${-len} Q${-wid} ${-len * .45} 0 0Z`;
}
function mandala(r, opts = {}) {
  const col = opts.color || 'url(#g-gold)';
  const sw = opts.sw || 2;
  let g = '';
  const rings = opts.rings || [
    { n: 8, r0: .12, len: .2, wid: .07 }, { n: 16, r0: .3, len: .17, wid: .05 },
    { n: 24, r0: .5, len: .16, wid: .035 }, { n: 32, r0: .68, len: .14, wid: .025 }, { n: 48, r0: .84, len: .12, wid: .016 },
  ];
  for (const ring of rings) {
    for (let i = 0; i < ring.n; i++) {
      const a = i * 360 / ring.n;
      g += `<path d="${petal(ring.len * r, ring.wid * r)}" transform="rotate(${a}) translate(0 ${-ring.r0 * r})"/>`;
    }
    g += `<circle r="${ring.r0 * r}"/>`;
  }
  for (let i = 0; i < 64; i++) {
    const a = i * Math.PI * 2 / 64;
    g += `<circle cx="${Math.cos(a) * r * .98}" cy="${Math.sin(a) * r * .98}" r="${r * .008}" fill="${opts.dot || '#f6d26b'}"/>`;
  }
  return `<svg viewBox="${-r} ${-r} ${2 * r} ${2 * r}" width="100%" height="100%"><g fill="none" stroke="${col}" stroke-width="${sw}">${g}</g></svg>`;
}

// Multifoil (cusped) jharokha arch outline. Local coords, (0,0) top-left, open bottom.
function archPath(w, h, lobes = 9, closed = false, ox = 0, oy = 0) {
  const A = w * .55;
  const pts = [];
  for (let k = 0; k <= lobes; k++) {
    const th = Math.PI - k * Math.PI / lobes;
    pts.push([ox + w / 2 + (w / 2) * Math.cos(th), oy + A - A * Math.sin(th)]);
  }
  let d = `M${ox} ${oy + h} L${ox} ${oy + A}`;
  for (let k = 1; k < pts.length; k++) {
    const [x0, y0] = pts[k - 1], [x1, y1] = pts[k];
    const c = Math.hypot(x1 - x0, y1 - y0);
    d += ` A${(c * .58).toFixed(1)} ${(c * .58).toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  d += ` L${ox + w} ${oy + h}`;
  if (closed) d += 'Z';
  return { d, pts };
}

function archFrameSVG(w, h) {
  const band = 26;
  const outer = archPath(w + band * 2, h + band, 9, false, -band, -band);
  const mid = archPath(w + band, h + band / 2, 9, false, -band / 2, -band / 2);
  const inner = archPath(w, h, 9, false);
  const cusps = inner.pts.slice(1, -1).map(([x, y]) => `<g transform="translate(${x} ${y})"><path d="M0 -9 L5 0 L0 9 L-5 0Z" fill="url(#g-gold-r)" stroke="#5a3608" stroke-width="1"/></g>`).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${inner.d}" fill="none" stroke="#2e0510" stroke-width="${band * 2 - 2}"/>
    <path d="${inner.d}" fill="none" stroke="url(#g-maroon)" stroke-width="${band * 2 - 8}" opacity=".9"/>
    <path class="lotusBand" d="${mid.d}" fill="none" stroke="none"/>
    <path d="${outer.d}" fill="none" stroke="#3a2205" stroke-width="9"/>
    <path d="${outer.d}" fill="none" stroke="url(#g-gold-h)" stroke-width="6"/>
    <path d="${inner.d}" fill="none" stroke="#3a2205" stroke-width="11"/>
    <path d="${inner.d}" fill="none" stroke="url(#g-gold-h)" stroke-width="7"/>
    <path d="${inner.d}" fill="none" stroke="#fff4dc" stroke-width="1.5" opacity=".75" transform="translate(0 0)"/>
    ${cusps}
  </svg>`;
}
// carved lotus-petal border along each arch band (needs layout, so done after insertion)
function decorateArches(root) {
  root.querySelectorAll('path.lotusBand').forEach(p => {
    const len = p.getTotalLength(), step = 22;
    let g = '';
    for (let d = step / 2; d < len; d += step) {
      const a = p.getPointAtLength(d), b = p.getPointAtLength(Math.min(len, d + 1));
      const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      g += `<g transform="translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${ang.toFixed(1)})"><path d="M-9 0 C-6 -6 -2 -7 0 -8 C2 -7 6 -6 9 0 C6 6 2 7 0 8 C-2 7 -6 6 -9 0Z" fill="none" stroke="#d9a845" stroke-width="1.3" opacity=".8"/><circle r="1.6" fill="#f6d26b"/></g>`;
    }
    p.insertAdjacentHTML('afterend', `<g>${g}</g>`);
  });
}

function marigold(x, y, r, alt) {
  // ruffled marigold: two rings of petals around a darker core
  const c1 = alt ? '#ffd31a' : '#ff9a1a', c2 = alt ? '#ffe680' : '#ffbe4d', dk = alt ? '#d18f00' : '#c44c00';
  let p = `<circle r="${r}" fill="${dk}"/>`;
  for (let k = 0; k < 12; k++) p += `<ellipse cx="0" cy="${-r * .62}" rx="${r * .32}" ry="${r * .42}" fill="${c1}" transform="rotate(${k * 30 + (alt ? 15 : 0)})"/>`;
  for (let k = 0; k < 8; k++) p += `<ellipse cx="0" cy="${-r * .32}" rx="${r * .25}" ry="${r * .32}" fill="${c2}" transform="rotate(${k * 45 + 20})"/>`;
  p += `<circle r="${r * .22}" fill="${dk}" opacity=".7"/>`;
  return `<g transform="translate(${x.toFixed ? x.toFixed(1) : x} ${y.toFixed ? y.toFixed(1) : y})">${p}</g>`;
}

function toranSVG() {
  let rope = `<path d="M0 10 Q270 20 540 10 Q810 20 1080 10" stroke="#7a4a0e" stroke-width="4" fill="none"/>`;
  let swags = '', strings = '', leaves = '';
  const xs = []; for (let i = 0; i < 13; i++) xs.push(40 + i * 83.3);
  // mango-leaf bandanwar along the rope
  for (let x = 18; x < 1080; x += 44) leaves += leaf(x, 10, (Math.round(x / 44) % 2 ? 14 : -14) + (rnd(x, 9) - .5) * 10, 1.25 + rnd(x, 8) * .3);
  // marigold swags
  for (let i = 0; i < xs.length - 1; i += 2) {
    const x0 = xs[i], x1 = xs[i + 2] || xs[i + 1];
    for (let k = 0; k <= 10; k++) {
      const u = k / 10, x = lerp(x0, x1, u), y = 20 + Math.sin(u * Math.PI) * 46;
      swags += marigold(x, y + 6 * Math.sin(u * Math.PI), 9 + rnd(i * 7 + k, 3) * 4, (k + i) % 2);
    }
  }
  // hanging strings (each in its own group so it can sway)
  xs.forEach((x, i) => {
    const n = [4, 2, 3, 2][i % 4];
    let g = `<path d="M0 0 L0 ${18 + n * 24}" stroke="#7a4a0e" stroke-width="2"/>`;
    for (let k = 0; k < n; k++) g += marigold((rnd(i, k) - .5) * 3, 20 + k * 24, 11 + rnd(i * 5 + k, 4) * 5, (k + i) % 2);
    g += i % 2 ? leaf(0, 14 + n * 24, 0, .7) : bell(0, 10 + n * 24, 1);
    strings += `<g class="string" data-i="${i}" transform="translate(${x} 12)">${g}</g>`;
  });
  return `<svg width="1080" height="200" viewBox="0 0 1080 200">${leaves}${rope}${strings}${swags}</svg>`;
}

/* ------------------------------------------------------------
   Slide builders
   ------------------------------------------------------------ */
const slides = [];
let cur = null;
function slide(dur, opts = {}) {
  const node = document.createElement('section');
  node.className = 'slide';
  document.getElementById('slides').appendChild(node);
  cur = { el: node, dur, anims: [], loops: [], fx: opts.fx || null, fxStart: opts.fxStart || 0, mask: opts.mask || null, hooks: [] };
  slides.push(cur);
  return cur;
}
// entrance animation registration
function keepBase(n) {
  if (n.dataset.base === undefined) n.dataset.base = n.style.transform || '';
  if (n.dataset.fbase === undefined) n.dataset.fbase = n.style.filter || '';
}
function A(sel, type, delay, dur = .9, ease = 'out') {
  const nodes = typeof sel === 'string' ? cur.el.querySelectorAll(sel) : [sel];
  nodes.forEach(n => { keepBase(n); cur.anims.push({ n, type, delay, dur, ease }); });
}
// continuous motion registration: fn(lt) -> transform string
function L(sel, fn) {
  const nodes = typeof sel === 'string' ? cur.el.querySelectorAll(sel) : [sel];
  nodes.forEach((n, i) => { keepBase(n); cur.loops.push({ n, fn, i }); });
}
function bgLayers(theme, extra = '') {
  const th = THEMES[theme];
  return `<div class="layer bgk" style="background:radial-gradient(ellipse at 50% 38%, ${th.bg[0]} 0%, ${th.bg[1]} 78%)"></div>
    <div class="pattern" style="background-image:${JAALI}"></div>${extra}<div class="vignette"></div>`;
}
function archBlock(x, y, w, h, theme, cls = '') {
  const th = THEMES[theme];
  const clip = archPath(w, h, 9, true).d;
  return `<div class="abs arch ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="abs archIn" style="inset:0;clip-path:path('${clip}');background:radial-gradient(ellipse at 50% 62%, ${th.arch[0]} 0%, ${th.arch[1]} 70%, #2a0610 125%)">
      <div class="abs rays" style="inset:0;background:radial-gradient(ellipse at 50% 70%, rgba(255,240,210,.35), transparent 60%)"></div>
      <div class="abs archMandala" style="left:${w / 2 - 330}px;top:${h * .62 - 330}px;width:660px;height:660px;opacity:.1">${mandala(330, { color: '#fff6dc', sw: 1.6, dot: '#fff6dc' })}</div>
      <div class="abs" style="inset:0;box-shadow:inset 0 0 80px 22px rgba(30,4,12,.5)"></div>
    </div>
    <div class="abs" style="inset:0">${archFrameSVG(w, h)}</div>
  </div>`;
}
function ledge(x, y, w) {
  let dent = '';
  for (let i = 0; i < Math.floor((w - 20) / 26); i++) dent += `<path d="M${16 + i * 26} 30 l13 -10 l13 10Z" fill="url(#g-gold)" opacity=".85"/>`;
  return `<svg class="abs" style="left:${x}px;top:${y}px" width="${w}" height="64" viewBox="0 0 ${w} 64">
    <rect x="0" y="0" width="${w}" height="18" rx="4" fill="url(#g-gold-h)" stroke="#4a2a06" stroke-width="2"/>
    <rect x="12" y="18" width="${w - 24}" height="42" fill="url(#g-maroon)" stroke="#4a2a06" stroke-width="2"/>
    ${dent}
    <g fill="url(#g-gold-r)">${Array.from({ length: Math.floor(w / 46) }, (_, i) => `<circle cx="${30 + i * 46}" cy="46" r="5"/>`).join('')}</g>
    <rect x="12" y="56" width="${w - 24}" height="5" fill="url(#g-gold-h)"/>
  </svg>`;
}
function coupleImg(key, cx, bottom, hgt, cls = '') {
  const c = COUPLES[key], w = c.w * hgt / c.h;
  return `<img class="abs couple ${cls}" src="${c.src}" style="left:${cx - w / 2}px;top:${bottom - hgt}px;width:${w}px;height:${hgt}px;filter:drop-shadow(0 18px 24px rgba(20,0,6,.55))">`;
}
function diyaRow(y, xs, size = 120) {
  return xs.map(x => `<div class="abs diya" style="left:${x - size / 2}px;top:${y}px;width:${size}px;height:${size * 150 / 140}px">${diyaSVG()}</div>`).join('');
}
const flicker = (n, i) => lt => `rotate(${4 * Math.sin(lt * 2.3 + i) * Math.sin(lt * .9 + i * 2)}deg) scale(${1 + .06 * Math.sin(lt * 17 + i * 2.1) + .04 * Math.sin(lt * 31.7 + i)}, ${1 + .1 * Math.sin(lt * 13 + i * 1.7) + .06 * Math.sin(lt * 23.3 + i * 3) + .04 * Math.sin(lt * 41 + i)})`;
function diyaLoops() {
  cur.el.querySelectorAll('.diya .flame').forEach((f, i) => { f.style.transformBox = 'fill-box'; f.style.transformOrigin = '50% 100%'; cur.loops.push({ n: f, fn: flicker(f, i), i }); });
  cur.el.querySelectorAll('.diya .glow').forEach((g, i) => { g.style.transformBox = 'fill-box'; g.style.transformOrigin = '50% 50%'; cur.loops.push({ n: g, fn: lt => `scale(${1 + .07 * Math.sin(lt * 9 + i)})`, i }); });
}
const spin = (speed, base = 0) => lt => `rotate(${base + lt * speed}deg)`;

}

/* Closing — both looks together */

buildOpening();
buildTitle();
buildInvite();
DAYS.forEach((_, d) => { buildDay(d); EVENTS.forEach((e, i) => { if (e.day === d) buildEvent(i); }); });
buildClosing();
decorateArches(document);

let T = 0;
for (const s of slides) { s.start = T; T += s.dur; }
const DURATION = T + .4;

/* Persistent day couples: stay in the arch through a day's slides */
const dayCouples = DAYS.map((day, d) => {
  const ss = slides.filter(s => s.day === d);
  const t0 = ss[0].start, t1 = ss[ss.length - 1].start + ss[ss.length - 1].dur;
  const key = day.couple;
  const hgt = key === 'casual' ? 640 : 730;
  const wrap = el(`<div class="layer" style="display:none">${coupleImg(key, 540, ARCH.y + ARCH.h - 2, hgt)}${ledge(ARCH.x - 24, ARCH.y + ARCH.h - 12, ARCH.w + 48)}</div>`);
  document.getElementById('couples').appendChild(wrap);
  return { wrap, img: wrap.querySelector('img'), t0, t1 };
});

/* Persistent pieces */
document.getElementById('toran').innerHTML = toranSVG();
document.getElementById('frame').innerHTML = frameSVG();
document.getElementById('palace').innerHTML = palaceSVG() + diyaRow(118, [90, 990], 96);
document.getElementById('doors').innerHTML = `
  <div class="abs" id="doorL" style="left:0;top:0;width:540px;height:1920px;transform-origin:0 50%">${doorSVG(false)}</div>
  <div class="abs" id="doorR" style="left:540px;top:0;width:540px;height:1920px;transform-origin:100% 50%">${doorSVG(true)}</div>
  <div class="abs" id="doorLight" style="left:520px;top:0;width:40px;height:1920px;background:linear-gradient(90deg,transparent,rgba(255,236,170,.95),transparent);opacity:0"></div>`;
const strings = [...document.querySelectorAll('#toran .string')].map(g => ({ g, x: +g.getAttribute('transform').match(/translate\(([\d.]+)/)[1], i: +g.dataset.i }));
const palaceFlames = [...document.querySelectorAll('#palace .flame')];
palaceFlames.forEach(f => { f.style.transformBox = 'fill-box'; f.style.transformOrigin = '50% 100%'; });

/* ------------------------------------------------------------
   Particles (deterministic in t)
   ------------------------------------------------------------ */
const cv = document.getElementById('fx'), cx = cv.getContext('2d');
function drawFx(type, lt, alpha) {
  if (alpha <= 0) return;
  cx.save(); cx.globalAlpha = alpha;
  if (type === 'petals' || type === 'rose' || type === 'haldi') {
    const cols = type === 'rose' ? ['#ff4d6d', '#c9184a', '#ff8fab', '#ffb3c6'] : type === 'haldi' ? ['#ffd31a', '#ffe066', '#ffb300', '#fff3a0'] : ['#ff9800', '#ffb300', '#ff6f00', '#ffd54f', '#e53935'];
    const wind = 40 * Math.sin(lt * .7) + 25 * Math.sin(lt * 1.9);
    for (let i = 0; i < 54; i++) {
      const depth = [.6, 1, 1.5][i % 3];
      const sp = (120 + rnd(i, 2) * 120) * depth;
      let y = lt * sp - 100 - rnd(i, 3) * 1100;
      if (y > H + 100) y = ((y + 100) % (H + 200)) - 100;
      if (y < -100) continue;
      const x = rnd(i, 1) * W + Math.sin(lt * (1 + rnd(i, 5)) + i) * 45 + wind * depth;
      const r = (8 + rnd(i, 4) * 8) * depth;
      cx.save(); cx.translate(x, y); cx.rotate(lt * (rnd(i, 6) - .5) * 4 + i);
      cx.scale(1, .35 + .65 * Math.abs(Math.sin(lt * 1.7 + i)));
      cx.globalAlpha = alpha * [.55, .85, 1][i % 3];
      cx.fillStyle = cols[i % cols.length];
      cx.beginPath(); cx.moveTo(0, -r); cx.bezierCurveTo(r * .9, -r * .6, r * .7, r * .7, 0, r); cx.bezierCurveTo(-r * .7, r * .7, -r * .9, -r * .6, 0, -r); cx.fill();
      cx.strokeStyle = 'rgba(120,30,0,.25)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(0, -r * .7); cx.lineTo(0, r * .8); cx.stroke();
      cx.restore();
    }
  } else if (type === 'sparkle' || type === 'stars') {
    const n = type === 'stars' ? 70 : 40;
    for (let i = 0; i < n; i++) {
      const x = rnd(i, 1) * W, y = 160 + rnd(i, 2) * (type === 'stars' ? 1100 : 1600);
      const tw = Math.pow(Math.max(0, Math.sin(lt * (1.5 + rnd(i, 3) * 2.5) + i * 1.7)), 3);
      const r = (type === 'stars' ? 3 : 5) + rnd(i, 4) * 9;
      cx.save(); cx.translate(x, y); cx.globalAlpha = alpha * tw; cx.fillStyle = i % 3 ? '#fff6d0' : '#ffd36b';
      cx.beginPath();
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * .22 : r; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      cx.closePath(); cx.fill(); cx.restore();
    }
    if (type === 'stars') {
      const p = (lt % 2.6) / .9; if (p < 1) {
        const x0 = 900 - p * 600, y0 = 200 + p * 260; const g = cx.createLinearGradient(x0, y0, x0 + 160, y0 - 70);
        g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        cx.strokeStyle = g; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(x0 + 160, y0 - 70); cx.stroke();
      }
    }
  } else if (type === 'confetti') {
    const cols = ['#ff4f9a', '#3fd6c6', '#ffd31a', '#ff7043', '#9c6bff', '#ffffff'];
    for (let i = 0; i < 70; i++) {
      const sp = 180 + rnd(i, 2) * 200, x = rnd(i, 1) * W + Math.sin(lt * 1.4 + i) * 40;
      const y = ((rnd(i, 3) * (H + 200) + lt * sp) % (H + 200)) - 100;
      cx.save(); cx.translate(x, y); cx.rotate(lt * 3 * (rnd(i, 4) - .5) + i);
      cx.scale(Math.cos(lt * 5 + i), 1); cx.fillStyle = cols[i % cols.length];
      cx.fillRect(-7, -11, 14, 22); cx.restore();
    }
  } else if (type === 'notes') {
    cx.font = '64px "FreeSerif", serif'; cx.textAlign = 'center';
    for (let i = 0; i < 18; i++) {
      const sp = 90 + rnd(i, 2) * 90, x = 80 + rnd(i, 1) * (W - 160) + Math.sin(lt * 1.5 + i) * 40;
      const y = H + 60 - ((rnd(i, 3) * (H + 200) + lt * sp) % (H + 200));
      cx.save(); cx.translate(x, y); cx.rotate(Math.sin(lt * 2 + i) * .3); cx.scale(.6 + rnd(i, 4) * .7, .6 + rnd(i, 4) * .7);
      cx.fillStyle = i % 2 ? '#f8d978' : '#ffc2e0'; cx.shadowColor = 'rgba(255,200,120,.8)'; cx.shadowBlur = 14;
      cx.fillText(i % 3 ? '♪' : '♫', 0, 0); cx.restore();
    }
  } else if (type === 'embers') {
    cx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 70; i++) {
      const sp = 140 + rnd(i, 2) * 220, x = rnd(i, 1) * W + Math.sin(lt * 2 + i) * 30;
      const y = H - ((rnd(i, 3) * (H + 100) + lt * sp) % (H + 100));
      const r = 2 + rnd(i, 4) * 5, g = cx.createRadialGradient(x, y, 0, x, y, r * 4);
      g.addColorStop(0, 'rgba(255,240,180,1)'); g.addColorStop(.3, 'rgba(255,150,30,.8)'); g.addColorStop(1, 'rgba(255,60,0,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 4, 0, Math.PI * 2); cx.fill();
    }
  } else if (type === 'fireworks') {
    cx.globalCompositeOperation = 'lighter';
    const cols = ['255,210,110', '255,120,170', '140,240,220', '255,255,255', '255,160,60'];
    for (let b = 0; b < 9; b++) {
      const period = 2.4, t0 = b * .55 + 1.0, tt = lt - t0; if (tt < 0) continue;
      const ph = (tt % period) / period, cyc = Math.floor(tt / period);
      if (ph > .75) continue;
      const bx = 170 + rnd(b, cyc + 1) * 740, by = 200 + rnd(b, cyc + 7) * 260;
      const rad = 60 + 160 * E.out(ph / .75), fade = 1 - ph / .75, col = cols[(b + cyc) % cols.length];
      for (let k = 0; k < 36; k++) {
        const a = k * Math.PI * 2 / 36 + b;
        const x = bx + Math.cos(a) * rad, y = by + Math.sin(a) * rad + ph * ph * 120;
        cx.fillStyle = `rgba(${col},${fade})`; cx.beginPath(); cx.arc(x, y, 3.2, 0, Math.PI * 2); cx.fill();
        cx.fillStyle = `rgba(${col},${fade * .35})`; cx.beginPath(); cx.arc(bx + Math.cos(a) * rad * .8, by + Math.sin(a) * rad * .8 + ph * ph * 100, 2, 0, Math.PI * 2); cx.fill();
      }
    }
    cx.globalCompositeOperation = 'source-over';
    drawFx('petals', lt, .8);
  }
  cx.restore();
}

/* ------------------------------------------------------------
   Renderer
   ------------------------------------------------------------ */
const IN = {
  fade: p => ({ o: p }),
  up: p => ({ o: p, t: `translateY(${(1 - p) * 70}px)` }),
  down: p => ({ o: p, t: `translateY(${-(1 - p) * 60}px)` }),
  left: p => ({ o: p, t: `translateX(${-(1 - p) * 180}px)` }),
  right: p => ({ o: p, t: `translateX(${(1 - p) * 180}px)` }),
  zoom: p => ({ o: p, t: `scale(${.6 + .4 * p})` }),
  pop: p => ({ o: clamp(p * 2.5), t: `scale(${Math.max(p, 0)})` }),
  rise: p => ({ o: clamp(p * 2), t: `translateY(${(1 - p) * 520}px)` }),
  blur: p => ({ o: p, f: `blur(${(1 - p) * 16}px)`, t: `scale(${1.12 - .12 * p})` }),
  wipe: p => ({ c: `inset(-20% ${(1 - p) * 50}% -20% ${(1 - p) * 50}%)` }),
  wipeL: p => ({ c: `inset(-30% ${(1 - p) * 100}% -30% -5%)` }),
};

function seek(t) {
  // slides
  for (const s of slides) {
    const lt = t - s.start;
    const visible = lt >= 0 && lt < s.dur + XF;
    if (!visible) { if (s.el.style.display !== 'none') s.el.style.display = 'none'; continue; }
    s.el.style.display = 'block';
    s.el.style.opacity = s === slides[0] ? 1 : E.inout(clamp(lt / XF));
    s.el.style.transform = `scale(${1 + .025 * clamp(lt / (s.dur + XF))})`;
    const last = s === slides[slides.length - 1];
    s.anims.forEach((a, k) => {
      const p = E[a.ease](clamp((lt - a.delay) / a.dur));
      const r = IN[a.type](p);
      // outgoing text lifts away just before the next slide covers it
      const q = last ? 0 : Math.pow(clamp((lt - (s.dur - .45 + Math.min(k, 8) * .03)) / .35), 2);
      a.n.style.opacity = (r.o === undefined ? 1 : r.o) * (1 - q);
      a.n.dataset.tin = (r.t || '') + (q > 0 ? ` translateY(${-30 * q}px)` : '');
      a.n.style.filter = `${a.n.dataset.fbase} ${r.f && p < 1 ? r.f : ''}`.trim();
      a.n.style.clipPath = r.c || '';
    });
    const loopT = new Map();
    for (const l of s.loops) loopT.set(l.n, (loopT.get(l.n) || '') + ' ' + l.fn(lt, l.i));
    const touched = new Set([...s.anims.map(a => a.n), ...s.loops.map(l => l.n)]);
    for (const n of touched) {
      n.style.transform = `${n.dataset.base || ''} ${n.dataset.tin || ''} ${loopT.get(n) || ''}`.trim();
    }
  }
  // day couples
  for (const dc of dayCouples) {
    const pin = E.out(clamp((t - dc.t0 - .15) / 1.1)), pout = clamp((t - dc.t1) / XF);
    const vis = t >= dc.t0 && t < dc.t1 + XF;
    dc.wrap.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    dc.wrap.style.opacity = clamp(pin * 2) * (1 - pout);
    dc.img.style.transform = `translateY(${(1 - pin) * 520 + Math.sin(t * 1.5) * 4}px)`;
  }
  // doors
  const pd = E.inout(clamp((t - .7) / 1.9));
  document.getElementById('doors').style.display = pd >= 1 ? 'none' : 'block';
  document.getElementById('doorL').style.transform = `rotateY(${pd * 100}deg)`;
  document.getElementById('doorR').style.transform = `rotateY(${-pd * 100}deg)`;
  document.getElementById('doorLight').style.opacity = clamp(t / .5) * (1 - clamp((t - .9) / .6));
  // toran drops in, then sways
  const pt = E.back(clamp((t - 1.6) / 1.2));
  document.getElementById('toran').style.transform = `translateY(${(1 - pt) * -220}px)`;
  const amp = 2 + 10 * Math.exp(-1.2 * Math.max(0, t - 2.8));
  for (const s of strings) s.g.setAttribute('transform', `translate(${s.x} 12) rotate(${Math.sin(t * 2.1 + s.i * .7) * amp})`);
  // palace silhouette (after the opening)
  const pp = clamp((t - slides[1].start) / 1.2);
  const palace = document.getElementById('palace');
  palace.style.opacity = pp;
  palace.style.transform = `translateY(${(1 - E.out(pp)) * 80}px)`;
  palaceFlames.forEach((f, i) => f.style.transform = flicker(f, i)(t));
  // particles
  cx.clearRect(0, 0, W, H);
  for (const s of slides) {
    if (!s.fx) continue;
    const lt = t - s.start;
    if (lt < s.fxStart || lt > s.dur + XF) continue;
    const a = clamp((lt - s.fxStart) / .8) * (1 - clamp((lt - s.dur) / XF));
    drawFx(s.fx, lt, a * .9);
    if (s.mask) {
      const [y0, y1] = s.mask, g = cx.createLinearGradient(0, y0 - 60, 0, y1 + 60);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.12, 'rgba(0,0,0,.85)'); g.addColorStop(.88, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      cx.save(); cx.globalCompositeOperation = 'destination-out'; cx.globalAlpha = a; cx.fillStyle = g; cx.fillRect(0, y0 - 60, W, y1 - y0 + 120); cx.restore();
    }
  }
}

window.__DURATION = DURATION;
window.__seek = seek;
window.__slides = slides.map(s => ({ start: s.start, dur: s.dur }));

/* Live preview in a browser (the render script passes ?capture) */
const capture = new URLSearchParams(location.search).has('capture');
function fit() {
  const st = document.getElementById('stage');
  const sc = Math.min(innerWidth / W, innerHeight / H);
  st.style.transform = `scale(${sc})`;
  document.body.style.height = innerHeight + 'px';
  st.style.marginLeft = ((innerWidth - W * sc) / 2) + 'px';
  document.body.style.justifyContent = 'flex-start';
}
if (!capture) {
  fit(); addEventListener('resize', fit);
  const music = document.getElementById('music');
  let t0 = null;
  const loop = now => {
    if (t0 === null) t0 = now;
    let t = (now - t0) / 1000;
    if (!music.paused) t = music.currentTime;
    if (t > DURATION) { t0 = now; if (!music.paused) { music.currentTime = 0; } t = 0; }
    seek(t);
    requestAnimationFrame(loop);
  };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
  const hint = document.getElementById('playHint');
  hint.style.display = 'block';
  hint.onclick = () => { hint.style.display = 'none'; music.currentTime = 0; t0 = null; music.play().catch(() => {}); };
} else {
  seek(0);
}
</script>
