<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veeral weds Konika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Cinzel:wght@500;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #1b0a05; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #c9974f; transform-origin: 0 0; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; will-change: opacity, transform; }
  .hi { font-family: 'Rozha One', serif; font-weight: 400; }
  .tiro { font-family: 'Tiro Devanagari Hindi', serif; }
  .cinzel { font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase; }
  .script { font-family: 'Great Vibes', cursive; }
  .corm { font-family: 'Cormorant Garamond', serif; }
  .block { position: absolute; left: 60px; right: 60px; text-align: center; }
  .block > * { opacity: 0; }
  .w { display: inline-block; }
  /* light text on dark skies, maroon text on light skies / sandstone */
  .day  { color: #5c1210; text-shadow: 0 0 18px rgba(255,246,226,.95), 0 0 6px rgba(255,246,226,.9), 0 1px 0 rgba(255,250,236,.8); }
  .day .gold { color: #9a2d12; }
  .night { color: #fff3dc; text-shadow: 0 2px 10px rgba(20,6,30,.85), 0 0 26px rgba(20,6,30,.6); }
  .night .gold { color: #f6d27a; }
  .scrim { padding: 26px 0 34px; background: radial-gradient(closest-side, rgba(255,241,214,.9), rgba(255,241,214,.55) 60%, rgba(255,241,214,0)); }
  .softscrim { padding: 20px 0 30px; background: radial-gradient(closest-side, rgba(255,241,214,.7), rgba(255,241,214,0)); }
  .rule { display: block; margin: 10px auto; width: 300px; height: 16px; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 9; font: 600 22px 'Cormorant Garamond', serif;
          color: #fff4dc; background: rgba(92,18,16,.88); border: 2px solid #e9b85a; border-radius: 40px; padding: 14px 30px; cursor: pointer; display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="texts"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
</div>
<div id="hint">▶ Tap to play with music</div>
<audio id="music" src="assets/music.m4a" preload="auto"></audio>

<script>
/* ==========================================================================
   Veeral weds Konika: painted Rajasthani street invite (v2)
   Everything is a pure function of time t, through seek(t). tools/render.mjs
   steps through it frame by frame to make the MP4.
   World units are pixels of the street panorama (4608 x 1536).
   ========================================================================== */
const W = 1080, H = 1920, ASPECT = H / W;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out: p => 1 - Math.pow(1 - p, 3),
  inout: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  sine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  back: p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
};
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const ramp = (t, a, b, ease = 'inout') => E[ease](clamp((t - a) / (b - a)));

/* ---------------- content ---------------- */
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'hi';
const EN = LANG === 'en';
const VENUE = EN ? 'Runicha Dham, Balotra · Rajasthan' : 'रुणिचा धाम, बालोतरा (राजस्थान)';
const DAYS = [
  { enDay: 'Day One', enDate: 'Thursday · 19 November 2026', hi: 'प्रथम दिवस', date: 'गुरुवार · 19 नवम्बर 2026', hole: [2450, 655, 2648, 950] },
  { enDay: 'Day Two', enDate: 'Friday · 20 November 2026', hi: 'द्वितीय दिवस', date: 'शुक्रवार · 20 नवम्बर 2026', hole: [3364, 654, 3547, 950] },
  { enDay: 'Day Three', enDate: 'Saturday · 21 November 2026', hi: 'तृतीय दिवस', date: 'शनिवार · 21 नवम्बर 2026', hole: [3988, 491, 4177, 846] },
];
const EVENTS = [
  { d: 0, img: 'E01', enTime: '12:05 PM', hi: 'गणेश स्थापना', en: 'Ganesh Sthapana', when: 'दोपहर', time: '12:05 बजे', sky: 'day' },
  { d: 0, img: 'E02', enTime: '4:15 PM', hi: 'मायरा स्वागत', en: 'Mayra Swagat', when: 'शाम', time: '4:15 बजे', sky: 'day' },
  { d: 0, img: 'E03', enTime: '7:15 PM', hi: 'रिंग सेरेमनी', en: 'Ring Ceremony', when: 'शाम', time: '7:15 बजे', sky: 'night' },
  { d: 1, img: 'E04', enTime: '8:00 AM', hi: 'कार्निवल', en: 'Carnival', when: 'सुबह', time: '8:00 बजे', sky: 'day' },
  { d: 1, img: 'E05', enTime: '4:00 PM', hi: 'बंदोली', en: 'Bandoli', when: 'शाम', time: '4:00 बजे', sky: 'night' },
  { d: 1, img: 'E06', enTime: '7:00 PM', hi: 'संगीत संध्या', en: 'Sangeet Sandhya', when: 'शाम', time: '7:00 बजे', sky: 'night' },
  { d: 1, img: 'E07', enTime: '12:15 AM · midnight', hi: 'घड़ी विनायक', en: 'Ghadi Vinayak', when: 'रात', time: '12:15 बजे', sky: 'night' },
  { d: 2, img: 'E08', enTime: '8:00 AM', hi: 'हल्दी एवं जनेऊ', en: 'Haldi & Janeu', when: 'सुबह', time: '8:00 बजे', sky: 'day' },
  { d: 2, img: 'E09', enTime: '3:00 PM', hi: 'बारात प्रस्थान · बंदोली', en: 'Baraat Prasthan · Bandoli', when: 'दोपहर', time: '3:00 बजे', sky: 'day' },
  { d: 2, img: 'E10', enTime: '7:21 – 9:34 PM', hi: 'मंगल फेरा', en: 'Mangal Phera', when: 'रात्रि', time: '7:21 – 9:34 बजे', sky: 'night' },
];
const WIPES = [['pillar', 'drape'], ['flowers', 'drape', 'petals'], ['flowers', 'pillar']];

/* ---------------- assets ---------------- */
const IMG = {};
const names = ['street', 'couple', 'rickshaw', 'puppets', 'banner', 'drape', 'pillar', 'flowers', 'petals'];
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => r(); i.onerror = () => r(); i.src = src; IMG[k] = i; });
const fontsReady = Promise.all(['72px "Rozha One"', '40px "Tiro Devanagari Hindi"', 'italic 40px "Tiro Devanagari Hindi"', '40px "Cinzel"', '700 40px "Cinzel"', '80px "Great Vibes"', '600 40px "Cormorant Garamond"', 'italic 500 40px "Cormorant Garamond"']
  .map(f => document.fonts.load(f, 'श्री गणेशाय नमः V&K Veeral वीरल कोनिका 0123'))).then(() => document.fonts.ready);
window.__ready = Promise.all([
  ...names.map(n => load(n, `assets/v2/${n}.webp`)),
  ...EVENTS.map(e => load(e.img, `assets/v2/${e.img}.jpg`)),
  fontsReady,
]);

/* ---------------- timeline ---------------- */
const TL = {};
let cursor = 0;
const seg = (name, dur) => { TL[name] = [cursor, cursor + dur]; cursor += dur; return TL[name]; };
seg('open', 3.0);
seg('toBanner', 1.6);
seg('banner', 8.125);
seg('toDoor', 1.25);
seg('couple', 3.125);
const EV_DUR = 3.75, WIPE = .9;   // 6 beats at 96 BPM
DAYS.forEach((day, d) => {
  seg(`toWin${d}`, 1.25);
  seg(`label${d}`, 1.25);
  seg(`zoomIn${d}`, 1.25);
  const evs = EVENTS.filter(e => e.d === d);
  evs.forEach((e, i) => { e.t0 = cursor; e.t1 = cursor + EV_DUR; e.i = i; e.n = evs.length; cursor += EV_DUR; });
  day.events = evs;
  seg(`zoomOut${d}`, 1.25);
});
seg('toEnd', 1.25);
seg('end', 5.625);
const DURATION = cursor + .3;

/* ---------------- street camera ---------------- */
const ZOOM_RECT = h => {               // scene rect that a window shows; full-frame cover at the end of the zoom
  const [x0, y0, x1, y1] = h, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let w = x1 - x0, hh = y1 - y0;
  if (w / hh > 1024 / 1536) hh = w * 1536 / 1024; else w = hh * 1024 / 1536;
  w *= 1.03; hh *= 1.03;
  return { x: cx - w / 2, y: cy - hh / 2, w, h: hh, cx, cy };
};
const OPENINGS = [[2479, 696, 142, 253], [3389, 701, 137, 244], [4001, 564, 159, 283]];   // largest 9:16 rect fully inside each window (assets/v2/holes.json)
DAYS.forEach((d, i) => {
  const [ox, oy, ow, oh] = OPENINGS[i];
  d.rectA = ZOOM_RECT(d.hole);                                    // scene as seen through the window from the street
  d.rect = d.rectA;
  const vw = ow * .96;
  d.camIn = { cx: ox + ow / 2, cy: oy + oh / 2, vw };             // camera ends fully inside the opening: no frame left on screen
  const z = W / vw, sw = 1280 / z, sh = 1920 / z;                 // scene placed so it is exactly the full-frame cover at that point
  d.rectB = { x: d.camIn.cx - sw / 2, y: d.camIn.cy - sh / 2, w: sw, h: sh };
});
const lerpRect = (a, b, q) => ({ x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q), w: lerp(a.w, b.w, q), h: lerp(a.h, b.h, q) });
function zoomQ(d, t) {                // 0 = seen from the street, 1 = filling the frame
  const [a0, a1] = TL[`zoomIn${d}`], [b0, b1] = TL[`zoomOut${d}`];
  if (t >= a0 && t <= a1) return E.inout((t - a0) / (a1 - a0));
  if (t >= b0 && t <= b1) return 1 - E.inout((t - b0) / (b1 - b0));
  return 0;
}
const BANNER = { cx: 1395, top: 288, w: 560 };
BANNER.h = BANNER.w * 1497 / 997;
const DOOR = { x: 2112, feet: 1330, h: 900 };
const DOOR_OPEN = [1968, 520, 2258, 1152], DOOR_SILL = 1150;    // world rect of the open doorway (measured in street.webp)

const keys = [];                       // [t, cx, cy, vw]
const K = (t, cx, cy, vw) => keys.push([t, cx, cy, vw]);
K(0, 432, 768, 864);
K(TL.open[1], 372, 812, 700);
K(TL.toBanner[1], 1395, 640, 660);
K(TL.banner[1], 1395, 650, 640);
K(TL.toDoor[1], 2120, 768, 864);
K(TL.couple[1], 2160, 768, 830);
DAYS.forEach((d, i) => {
  K(TL[`toWin${i}`][1], d.rect.cx, 768, 864);
  K(TL[`label${i}`][1], d.rect.cx, 790, 760);
  K(TL[`zoomIn${i}`][1], d.camIn.cx, d.camIn.cy, d.camIn.vw);
  K(TL[`zoomOut${i}`][0], d.camIn.cx, d.camIn.cy, d.camIn.vw);
  K(TL[`zoomOut${i}`][1], d.rect.cx, 790, 760);
});
K(TL.toEnd[1], 4020, 768, 864);
K(DURATION, 4026, 770, 850);

function camAt(t) {
  let i = 0;
  while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1];
  const p = clamp((t - a[0]) / Math.max(1e-6, b[0] - a[0]));
  const zoomPhase = Object.keys(TL).find(k => /^zoom(In|Out)/.test(k) && t >= TL[k][0] && t <= TL[k][1]);
  const e = zoomPhase ? (zoomPhase.startsWith('zoomIn') ? E.inout(p) : E.inout(p)) : E.sine(p);
  // zoom in log space so it feels constant-speed
  const vw = Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), e));
  // keep the zoom target fixed on screen: interpolate the centre in the same parameter as the zoom
  const q = Math.abs(Math.log(b[3] / a[3])) > .4 ? (vw - a[3]) / (b[3] - a[3]) : e;
  let cx = lerp(a[1], b[1], q), cy = lerp(a[2], b[2], q);
  const vh = vw * ASPECT;
  cx = clamp(cx, vw / 2, 4608 - vw / 2); cy = clamp(cy, vh / 2, 1536 - vh / 2);
  return { cx, cy, vw, vh, z: W / vw, x0: cx - vw / 2, y0: cy - vh / 2 };
}
const S = (c, x, y) => [(x - c.x0) * c.z, (y - c.y0) * c.z];

/* ---------------- drawing helpers ---------------- */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const fx = document.getElementById('fx'), fg = fx.getContext('2d');
g.imageSmoothingQuality = 'high';

function cover(img, sx = 1, ox = 0, oy = 0) {   // draw an event scene to fill the frame, scaled sx about the centre
  const s = Math.max(W / img.width, H / img.height) * sx;
  const w = img.width * s, h = img.height * s;
  g.drawImage(img, (W - w) / 2 + ox, (H - h) / 2 + oy, w, h);
}
function goldFill(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fff1bf'); gr.addColorStop(.35, '#f2c862'); gr.addColorStop(.62, '#8a5a10'); gr.addColorStop(1, '#f0cf78');
  return gr;
}
// world-anchored text (scales with the camera)
function wtext(c, str, x, y, size, font, fill, alpha = 1, opts = {}) {
  if (alpha <= 0) return;
  const [sx, sy] = S(c, x, y), px = size * c.z;
  g.save();
  g.globalAlpha = alpha;
  const fm = font.match(/^((?:italic\s+)?(?:\d{3}\s+)?)(.*)$/);           // style/weight must come before the size
  g.font = `${fm[1]}${opts.weight || ''} ${px}px ${fm[2]}`;
  g.textAlign = opts.align || 'center'; g.textBaseline = 'alphabetic';
  if (opts.shadow) { g.shadowColor = opts.shadow; g.shadowBlur = px * .25; g.shadowOffsetY = px * .03; }
  g.fillStyle = fill === 'gold' ? goldFill(sy - px, sy + px * .2) : fill;
  if (opts.clipW !== undefined) { g.beginPath(); g.rect(sx - 2000, sy - px * 2, 2000 + opts.clipW * c.z, px * 3); g.clip(); }
  g.fillText(str, sx, sy + (opts.dy || 0) * px);
  if (opts.stroke) { g.shadowColor = 'transparent'; g.lineWidth = Math.max(1, px * .02); g.strokeStyle = opts.stroke; g.strokeText(str, sx, sy); }
  g.restore();
}

const gleamCanvas = Object.assign(document.createElement('canvas'), { width: 1080, height: 1920 });
/* monogram painted on a plaster panel (world coords) */
function monogram(c, cx, cy, s, p, gleam) {
  if (p <= 0) return;
  const reveal = p * 1.2;
  // V & K, revealed left to right like a brush stroke
  const span = 230 * s;
  g.save();
  const [lx] = S(c, cx - span / 2, cy);
  g.beginPath(); g.rect(-10, -10, lx + clamp(reveal) * span * c.z + 30 * c.z, H + 20); g.clip();
  wtext(c, 'V', cx - 62 * s, cy + 40 * s, 128 * s, '"Cinzel"', 'gold', 1, { weight: 700, shadow: 'rgba(70,20,5,.55)', stroke: '#5c1210' });
  wtext(c, '&', cx + 2 * s, cy + 18 * s, 78 * s, '"Great Vibes"', '#8e1d14', 1, {});
  wtext(c, 'K', cx + 64 * s, cy + 40 * s, 128 * s, '"Cinzel"', 'gold', 1, { weight: 700, shadow: 'rgba(70,20,5,.55)', stroke: '#5c1210' });
  g.restore();
  // thin gold rules and the names under it
  const a2 = clamp((p - .55) / .45);
  const [rx, ry] = S(c, cx, cy + 82 * s);
  g.save(); g.globalAlpha = a2; g.strokeStyle = goldFill(ry - 2, ry + 2); g.lineWidth = 2.2 * c.z * s;
  g.beginPath(); g.moveTo(rx - 80 * s * c.z * a2, ry); g.lineTo(rx + 80 * s * c.z * a2, ry); g.stroke(); g.restore();
  wtext(c, 'Veeral & Konika', cx, cy + 132 * s, 34 * s, '"Great Vibes"', '#7d1a12', a2, {});
  if (gleam !== undefined && gleam > 0 && gleam < 1) {            // light sweep, clipped to the letters
    const off = gleamCanvas, o = off.getContext('2d');
    o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-over'; o.clearRect(0, 0, W, H);
    const [vx, vy] = S(c, cx - 62 * s, cy + 40 * s), [kx] = S(c, cx + 64 * s, cy), px = 128 * s * c.z;
    o.font = `700 ${px}px "Cinzel"`; o.textAlign = 'center'; o.fillStyle = '#fff';
    o.fillText('V', vx, vy); o.fillText('K', kx, vy);
    const [gx] = S(c, cx - span / 2 + gleam * span * 1.3, cy);
    const gr = o.createLinearGradient(gx - 45 * c.z, 0, gx + 45 * c.z, 0);
    gr.addColorStop(0, 'rgba(255,246,210,0)'); gr.addColorStop(.5, 'rgba(255,246,210,1)'); gr.addColorStop(1, 'rgba(255,246,210,0)');
    o.globalCompositeOperation = 'source-in'; o.fillStyle = gr; o.fillRect(0, 0, W, H);
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .55 * Math.sin(gleam * Math.PI); g.drawImage(off, 0, 0); g.restore();
  }
}

/* ---------------- street ---------------- */
function holeScene(d, t) {
  const day = DAYS[d];
  const after = t >= TL[`zoomOut${d}`][0];
  return IMG[(after ? day.events[day.events.length - 1] : day.events[0]).img];
}
function drawStreet(t, c, alpha) {
  // scenes behind the window openings
  DAYS.forEach((day, d) => {
    let r = lerpRect(day.rectA, day.rectB, zoomQ(d, t));
    // the scene must always cover the part of the window opening that is on screen
    const [hx0, hy0, hx1, hy1] = day.hole;
    const ix0 = Math.max(hx0, c.x0), iy0 = Math.max(hy0, c.y0), ix1 = Math.min(hx1, c.x0 + c.vw), iy1 = Math.min(hy1, c.y0 + c.vh);
    if (ix1 > ix0 && iy1 > iy0) {
      const k = Math.max(1, (r.x + r.w - ix0) > 0 ? 0 : 1,
        (ix1 - (r.x + r.w / 2)) / (r.w / 2), ((r.x + r.w / 2) - ix0) / (r.w / 2),
        (iy1 - (r.y + r.h / 2)) / (r.h / 2), ((r.y + r.h / 2) - iy0) / (r.h / 2));
      if (k > 1) r = { x: r.x + r.w / 2 - r.w * k / 2, y: r.y + r.h / 2 - r.h * k / 2, w: r.w * k, h: r.h * k };
    }
    const [x, y] = S(c, r.x, r.y);
    g.drawImage(holeScene(d, t), x, y, r.w * c.z, r.h * c.z);
    if (d === 2 && t > TL.toEnd[0]) {                       // finale: the window glows warm behind the couple
      const [hx0s, hy0s] = S(c, hx0, hy0), [hx1s, hy1s] = S(c, hx1, hy1);
      const gcx = (hx0s + hx1s) / 2, gcy = (hy0s + hy1s) / 2, gr = Math.max(hx1s - hx0s, hy1s - hy0s);
      const gg = g.createRadialGradient(gcx, gcy, 0, gcx, gcy, gr * .7);
      gg.addColorStop(0, '#ffe3a0'); gg.addColorStop(1, '#c8641e');
      g.save(); g.globalAlpha = ramp(t, TL.toEnd[0], TL.toEnd[0] + .8); g.fillStyle = gg; g.fillRect(hx0s, hy0s, hx1s - hx0s, hy1s - hy0s); g.restore();
    }
  });
  g.save(); g.globalAlpha = alpha;
  g.drawImage(IMG.street, c.x0, c.y0, c.vw, c.vh, 0, 0, W, H);
  g.restore();
  if (alpha <= 0) return;
  g.save(); g.globalAlpha = alpha;

  // opening monogram + Ganesh line on the plaster panel at the left
  const pm = ramp(t, .5, 2.6, 'out');
  wtext(c, EN ? '|| Shree Ganeshaya Namah ||' : '॥ श्री गणेशाय नमः ॥', 360, 672, EN ? 13 : 21, EN ? '"Cinzel"' : '"Tiro Devanagari Hindi"', '#7a1a10', ramp(t, .2, 1.0), { shadow: 'rgba(255,240,210,.8)' });
  monogram(c, 360, 830, .92, pm, (t - 2.2) / 1.0);

  // banner hanging from the elder's rod, unrolling downward
  drawBanner(t, c);

  // couple stepping out of the haveli doorway
  // ...and heading back inside once the camera moves on to the events
  drawCouple(t, c, DOOR.x, DOOR.feet, DOOR.h, TL.couple[0], true, TL.toWin0[0]);
  // couple waiting at the palace gate for the finale
  drawCouple(t, c, 4180, 1336, 780, TL.end[0], false);
  monogram(c, 3780, 600, 1.0, ramp(t, TL.toEnd[1] - .3, TL.toEnd[1] + 1.2, 'out'), (t - TL.end[0] - 1.2) / 1.2);

  // cycle-rickshaw rolling along the street during the opening
  const rp = clamp((t - .8) / 11.5);
  if (rp > 0 && rp < 1) {
    const rx = lerp(-760, 2900, rp), bob = Math.abs(Math.sin(t * 9)) * 4;
    const rh = 380, rw = rh * IMG.rickshaw.width / IMG.rickshaw.height;
    const [sx, sy] = S(c, rx, 1452 - rh - bob);
    g.drawImage(IMG.rickshaw, sx, sy, rw * c.z, rh * c.z);
  }
  g.restore();
}

function drawBanner(t, c) {
  const [b0] = TL.banner;
  const u = ramp(t, b0 + .1, b0 + 1.9, 'inout');          // unroll progress

    const st = document.getElementById('stage'), sc = Math.min(innerWidth / W, innerHeight / H);
    st.style.transform = `scale(${sc})`; st.style.marginLeft = ((innerWidth - W * sc) / 2) + 'px';
  };
  fit(); addEventListener('resize', fit);
  const music = document.getElementById('music'), hint = document.getElementById('hint');
  let t0 = null;
  window.__ready.then(() => {
    const loop = now => {
      if (t0 === null) t0 = now;
      let t = music.paused ? (now - t0) / 1000 : music.currentTime;
      if (t > DURATION) { t0 = now; if (!music.paused) music.currentTime = 0; t = 0; }
      seek(t); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    hint.style.display = 'block';
    hint.onclick = () => { hint.style.display = 'none'; music.currentTime = 0; t0 = null; music.play().catch(() => {}); };
  });
} else {
  window.__ready.then(() => seek(0));
}
</script>
