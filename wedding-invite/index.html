<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Amita:wght@700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #1b0a05; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #c9974f; transform-origin: 0 0; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; will-change: opacity, transform; }
  .hi { font-family: 'Rozha One', serif; font-weight: 400; }
  .tiro { font-family: 'Tiro Devanagari Hindi', serif; }
  .cinzel { font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase; }
  .script { font-family: 'Great Vibes', cursive; }
  .corm { font-family: 'Cormorant Garamond', serif; font-variant-numeric: lining-nums; font-variant-ligatures: no-common-ligatures; }
  .block { position: absolute; left: 60px; right: 60px; text-align: center; }
  .block > * { opacity: 0; }
  .w { display: inline-block; }
  /* light text on dark skies, maroon text on light skies / sandstone */
  .day  { color: #5c1210; text-shadow: 0 0 10px rgba(255,246,226,.8), 0 1px 0 rgba(255,250,236,.8); }
  .carded { text-shadow: none; }
  .day .gold { color: #9a2d12; }
  .night { color: #fff3dc; text-shadow: 0 2px 10px rgba(20,6,30,.85), 0 0 26px rgba(20,6,30,.6); }
  .night .gold { color: #f6d27a; }
  .scrim { padding: 26px 0 34px; background: radial-gradient(closest-side, rgba(255,241,214,.9), rgba(255,241,214,.55) 60%, rgba(255,241,214,0)); }
  .softscrim { padding: 30px 0 44px; background: radial-gradient(closest-side, rgba(255,244,222,.84), rgba(255,244,222,.6) 55%, rgba(255,244,222,0)); }
  .nightscrim { padding: 30px 0 44px; background: radial-gradient(closest-side, rgba(14,10,40,.62), rgba(14,10,40,.38) 55%, rgba(14,10,40,0)); }
  .rule { display: block; margin: 8px auto 10px; width: 360px; height: 24px; }
  .mini { display: block; margin: 2px auto 12px; width: 220px; height: 16px; }
  .mini.tight { margin: 0 auto 4px; }
  /* programme rows: titles right-aligned and times left-aligned on either side of the centre line */
  .prow { display: grid; grid-template-columns: calc(50% + var(--gut) - 14px) 28px 1fr; align-items: baseline; line-height: 1.2; white-space: nowrap; }
  .prow > :first-child { justify-self: end; }
  .prow > :last-child { justify-self: start; }
  .pdot { justify-self: center; width: 5px; height: 5px; border-radius: 50%; background: #d9a944; transform: translateY(-.28em); }
  .mini.wide { width: 540px; height: 16px; margin: 0 auto 4px; }
  /* foil titles: a base gradient plus a specular band (moved by seekTexts), clipped to the glyphs */
  .foil, .ruby { display: inline-block; padding: .2em .3em; margin: -.2em -.3em; text-shadow: none;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    background-repeat: no-repeat; background-size: 300% 100%, 100% 100%; background-position: 100% 0, 0 0; }
  .foil { background-image: linear-gradient(100deg, rgba(255,250,230,0) 48.5%, rgba(255,250,230,.7) 50%, rgba(255,250,230,0) 51.5%),
      linear-gradient(180deg, #fff2c4 12%, #f6d67a 30%, #dcaa4c 48%, #b98636 60%, #d6a446 72%, #f8de90 86%, #e4b656 100%);
    filter: drop-shadow(0 1px 0 rgba(70,30,6,.55)) drop-shadow(0 6px 16px rgba(8,4,24,.55)); }
  .ruby { background-image: linear-gradient(100deg, rgba(255,214,170,0) 48.5%, rgba(255,214,170,.6) 50%, rgba(255,214,170,0) 51.5%),
      linear-gradient(180deg, #74101c 0%, #a11a2c 25%, #7c0f1c 55%, #4e0810 95%);
    filter: drop-shadow(0 1px 0 rgba(201,151,63,.6)); }
  .softscrim .ruby { filter: drop-shadow(0 1px 0 rgba(201,151,63,.6)) drop-shadow(0 0 12px rgba(255,244,222,.7)); }
  .cart { position: absolute; left: 50%; pointer-events: none; overflow: visible; }
  .block.carded > :not(.cart) { position: relative; opacity: 1; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 9; font: 600 22px 'Cormorant Garamond', serif;
          color: #fff4dc; background: rgba(92,18,16,.88); border: 2px solid #e9b85a; border-radius: 40px; padding: 14px 30px; cursor: pointer; display: none; }
</style>

<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <canvas id="pt" width="1080" height="1920"></canvas>
  <div id="texts"><svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="rgL" x1="0" x2="1"><stop offset="0" stop-color="#c38a2a" stop-opacity="0"/><stop offset="1" stop-color="#c38a2a"/></linearGradient>
    <linearGradient id="rgR" x1="0" x2="1"><stop offset="0" stop-color="#c38a2a"/><stop offset="1" stop-color="#c38a2a" stop-opacity="0"/></linearGradient>
    <linearGradient id="cPaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".7" stop-color="#fbf0d8"/><stop offset="1" stop-color="#f3e0b8"/></linearGradient>
    <linearGradient id="cGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c46a"/><stop offset=".35" stop-color="#b07a22"/><stop offset=".55" stop-color="#f3d58a"/><stop offset="1" stop-color="#a26c1a"/></linearGradient>
    <filter id="cTex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .6" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .34  0 0 0 0 .14  0 0 0 .5 -.12"/><feComposite in2="SourceGraphic" operator="in"/></filter>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#3a1204" flood-opacity=".35" result="a"/>
      <feDropShadow in="SourceGraphic" dx="0" dy="10" stdDeviation="11" flood-color="#3a1204" flood-opacity=".2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/></feMerge></filter>
  </defs></svg></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
</div>
<div id="hint">▶ Tap to play with music</div>
<audio id="music" src="assets/music.m4a" preload="auto"></audio>

<script>
/* ==========================================================================
   Veeral weds Konika: painted Rajasthani street invite (v2)
   Everything is a pure function of time t, through seek(t). tools/render.mjs
   steps through it frame by frame to make the MP4.
   World units are pixels of the street panorama (4608 x 1536).
   ========================================================================== */
const W = 1080, H = 1920, ASPECT = H / W;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out: p => 1 - Math.pow(1 - p, 3),
  inout: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  sine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  back: p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  through: p => 3 * p * p - 2 * p * p * p + .16 * (p * p * p - p * p),   // ease in, leave with a little speed
};
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const ramp = (t, a, b, ease = 'inout') => E[ease](clamp((t - a) / (b - a)));

/* ---------------- content ---------------- */
const LANG = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'hi';
const EN = LANG === 'en';
const VENUE = EN ? 'Runicha Dham, Balotra · Rajasthan' : 'रुणिचा धाम, बालोतरा (राजस्थान)';
const VENUE_SHORT = EN ? 'Runicha Dham, Balotra' : 'रुणिचा धाम, बालोतरा';
const DAYS = [
  { enDay: 'Day One', enDate: 'Thursday · 19 November 2026', hi: 'प्रथम दिवस', date: 'गुरुवार · 19 नवंबर 2026', hole: [2450, 655, 2648, 950] },
  { enDay: 'Day Two', enDate: 'Friday · 20 November 2026', hi: 'द्वितीय दिवस', date: 'शुक्रवार · 20 नवंबर 2026', hole: [3364, 654, 3547, 950] },
  { enDay: 'Day Three', enDate: 'Saturday · 21 November 2026', hi: 'तृतीय दिवस', date: 'शनिवार · 21 नवंबर 2026', hole: [3988, 491, 4177, 846] },
];
const EVENTS = [   // one slide each; a slide can carry several events. dur: seconds on screen (multiples of a 96 BPM beat)
  { d: 0, img: 'E01', dur: 3.75, sky: 'day', items: [
    { hi: 'गणेश स्थापना', en: 'Ganesh Sthapana', when: 'दोपहर', time: '12:05 बजे', enTime: '12:05 PM' },
    { hi: 'मायरा स्वागत', en: 'Mayra Swagat', when: 'शाम', time: '4:15 बजे', enTime: '4:15 PM' }] },
  { d: 0, img: 'E03', dur: 2.5, sky: 'night', anchorTop: 1, top: 48, items: [
    { hi: 'रिंग सेरेमनी', en: 'Ring Ceremony', when: 'शाम', time: '7:15 बजे', enTime: '7:15 PM' }] },
  { d: 1, img: 'E04', dur: 2.5, sky: 'day', anchorTop: 1, kbK: 2, items: [
    { hi: 'कार्निवल', en: 'Carnival', when: 'सुबह', time: '8:00 बजे', enTime: '8:00 AM' }] },
  { d: 1, img: 'E06', dur: 4.375, sky: 'night', anchorTop: 1, top: 66, items: [
    { hi: 'बंदोली', en: 'Bandoli', when: 'शाम', time: '4:00 बजे', enTime: '4:00 PM' },
    { hi: 'संगीत संध्या', en: 'Sangeet Sandhya', when: 'शाम', time: '7:00 बजे', enTime: '7:00 PM' },
    { hi: 'घड़ी विनायक', en: 'Ghadi Vinayak', when: 'रात्रि', time: '12:15 बजे', enTime: 'Friday night · 12:15 AM' }] },
  { d: 2, img: 'E08', dur: 2.5, sky: 'day', anchorTop: 1, kbK: 5, items: [
    { hi: 'हल्दी एवं जनेऊ', en: 'Haldi & Janeu', when: 'सुबह', time: '8:00 बजे', enTime: '8:00 AM' }] },
  { d: 2, img: 'E09', dur: 2.5, sky: 'day', cap: 720, items: [
    { hi: 'बारात प्रस्थान एवं बंदोली', en: 'Baraat Prasthan & Bandoli', when: 'दोपहर', time: '3:00 बजे', enTime: '3:00 PM' }] },
  { d: 2, img: 'E10', dur: 3.125, sky: 'night', top: 70, items: [
    { hi: 'मंगल फेरा', en: 'Mangal Phera', when: 'रात्रि', time: '7:21 – 9:34 बजे', enTime: '7:21 – 9:34 PM' }] },
];
const WIPES = [['drape'], ['petals'], ['flowers', 'pillar']];
// a top-anchored scene keeps its top edge at the frame top, so the people sit lower, clear of the titles
const topShift = (e, s) => e.anchorTop ? 960 * (s - 1) * e.anchorTop : 0;

/* ---------------- assets ---------------- */
const IMG = {};
const names = ['street', 'couple', 'rickshaw', 'puppets', 'banner', 'drape', 'pillar', 'flowers', 'petals'];
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => r(); i.onerror = () => r(); i.src = src; IMG[k] = i; });
const fontsReady = Promise.all(['72px "Rozha One"', '40px "Tiro Devanagari Hindi"', 'italic 40px "Tiro Devanagari Hindi"', '40px "Cinzel"', '700 40px "Cinzel"', '80px "Great Vibes"', '600 40px "Cormorant Garamond"', 'italic 500 40px "Cormorant Garamond"', '700 40px "Cinzel Decorative"', '700 40px "Amita"']
  .map(f => document.fonts.load(f, 'श्री गणेशाय नमः V&K Veeral वीरल कोनिका 0123'))).then(() => document.fonts.ready);
window.__ready = Promise.all([
  ...names.map(n => load(n, `assets/v2/${n}.webp`)),
  ...EVENTS.map(e => load(e.img, `assets/v2/${e.img}.jpg`)),
  load('ganesha', 'assets/art/ganesha.webp'),
  fontsReady,
]);

/* ---------------- timeline ---------------- */
const TL = {};
let cursor = 0;
const seg = (name, dur) => { TL[name] = [cursor, cursor + dur]; cursor += dur; return TL[name]; };
seg('open', 3.125);
seg('toBanner', 1.25);
seg('banner', 5.0);
seg('toDoor', 1.25);
seg('couple', 2.5);
const WIPE = .9;
DAYS.forEach((day, d) => {
  seg(`toWin${d}`, 1.25);
  seg(`zoomIn${d}`, 1.25);
  const evs = EVENTS.filter(e => e.d === d);
  evs.forEach((e, i) => { e.t0 = cursor; e.t1 = cursor + e.dur; e.i = i; e.n = evs.length; cursor += e.dur; });
  day.events = evs;
  seg(`zoomOut${d}`, 1.25);
});
seg('toEnd', 1.25);
seg('end', 4.375);
const DURATION = cursor + .3;

/* ---------------- street camera ---------------- */
const ZOOM_RECT = h => {               // scene rect that a window shows; full-frame cover at the end of the zoom
  const [x0, y0, x1, y1] = h, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let w = x1 - x0, hh = y1 - y0;
  if (w / hh > 1024 / 1536) hh = w * 1536 / 1024; else w = hh * 1024 / 1536;
  w *= 1.03; hh *= 1.03;
  return { x: cx - w / 2, y: cy - hh / 2, w, h: hh, cx, cy };
};
const OPENINGS = [[2479, 696, 142, 253], [3389, 701, 137, 244], [4001, 564, 159, 283]];   // largest 9:16 rect fully inside each window (assets/v2/holes.json)
DAYS.forEach((d, i) => {
  const [ox, oy, ow, oh] = OPENINGS[i];
  d.rectA = ZOOM_RECT(d.hole);                                    // scene as seen through the window from the street
  d.rect = d.rectA;
  const vw = ow * .96;
  d.camIn = { cx: ox + ow / 2, cy: oy + oh / 2, vw };             // camera ends fully inside the opening: no frame left on screen
  const z = W / vw, sw = 1280 * 1.07 / z, sh = 1920 * 1.07 / z;   // scene placed 7% past full-frame cover at that point
  const rb = e => ({ x: d.camIn.cx - sw / 2, y: d.camIn.cy - sh / 2 + topShift(e, 1.07) / z, w: sw, h: sh });
  d.rectBIn = rb(d.events[0]);                                    // the zoom lands on the first slide's framing...
  d.rectBOut = rb(d.events[d.events.length - 1]);                 // ...and leaves from the last slide's
});
const lerpRect = (a, b, q) => ({ x: lerp(a.x, b.x, q), y: lerp(a.y, b.y, q), w: lerp(a.w, b.w, q), h: lerp(a.h, b.h, q) });
function zoomQ(d, t) {                // 0 = seen from the street, 1 = filling the frame
  const [a0, a1] = TL[`zoomIn${d}`], [b0, b1] = TL[`zoomOut${d}`];
  if (t >= a0 && t <= a1) return E.through((t - a0) / (a1 - a0));
  if (t >= b0 && t <= b1) return 1 - E.inout((t - b0) / (b1 - b0));
  return 0;
}
const BANNER = { cx: 1395, top: 288, w: 560 };
BANNER.h = BANNER.w * 1497 / 997;
const DOOR = { x: 2112, feet: 1330, h: 900 };
const DOOR_OPEN = [1968, 520, 2258, 1152], DOOR_SILL = 1150;    // world rect of the open doorway (measured in street.webp)

const keys = [];                       // [t, cx, cy, vw]
const K = (t, cx, cy, vw) => keys.push([t, cx, cy, vw]);
K(0, 432, 768, 864);
K(TL.open[1], 363, 760, 560);
K(TL.toBanner[1], 1395, 640, 660);
K(TL.banner[1], 1395, 650, 640);
K(TL.toDoor[1], 2120, 768, 864);
K(TL.couple[1], 2160, 768, 830);
DAYS.forEach((d, i) => {
  K(TL[`toWin${i}`][1], d.rect.cx, 776, 820);
  K(TL[`zoomIn${i}`][1], d.camIn.cx, d.camIn.cy, d.camIn.vw);
  K(TL[`zoomOut${i}`][0], d.camIn.cx, d.camIn.cy, d.camIn.vw);
  K(TL[`zoomOut${i}`][1], d.rect.cx, 790, 760);
});
K(TL.toEnd[1] - .3, 4176, 768, 864);
K(TL.end[0] + .5, 4176, 768, 864);                       // hold while they step out of the gate, then walk with them
K(TL.end[0] + 1.6, 4020, 768, 864);
K(DURATION, 4026, 770, 850);

function camAt(t) {
  let i = 0;
  while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1];
  const p = clamp((t - a[0]) / Math.max(1e-6, b[0] - a[0]));
  const zoomPhase = Object.keys(TL).find(k => /^zoom(In|Out)/.test(k) && t >= TL[k][0] && t <= TL[k][1]);
  const e = zoomPhase ? (zoomPhase.startsWith('zoomIn') ? E.through(p) : E.inout(p)) : E.sine(p);
  // zoom in log space so it feels constant-speed
  const vw = Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), e));
  // keep the zoom target fixed on screen: interpolate the centre in the same parameter as the zoom
  const q = Math.abs(Math.log(b[3] / a[3])) > .4 ? (vw - a[3]) / (b[3] - a[3]) : e;
  let cx = lerp(a[1], b[1], q), cy = lerp(a[2], b[2], q);
  const vh = vw * ASPECT;
  cx = clamp(cx, vw / 2, 4608 - vw / 2); cy = clamp(cy, vh / 2, 1536 - vh / 2);
  return { cx, cy, vw, vh, z: W / vw, x0: cx - vw / 2, y0: cy - vh / 2 };
}
const S = (c, x, y) => [(x - c.x0) * c.z, (y - c.y0) * c.z];

/* ---------------- drawing helpers ---------------- */
const cv = document.getElementById('cv'); let g = cv.getContext('2d');
const fx = document.getElementById('fx'), fg = fx.getContext('2d');           // wipes and the fade: above the titles
const pg = document.getElementById('pt').getContext('2d');                       // petals and light leaks: under the titles
g.imageSmoothingQuality = 'high';

function cover(img, sx = 1, ox = 0, oy = 0) {   // draw an event scene to fill the frame, scaled sx about the centre
  const s = Math.max(W / img.width, H / img.height) * sx;
  const w = img.width * s, h = img.height * s;
  g.drawImage(img, (W - w) / 2 + ox, (H - h) / 2 + oy, w, h);
}
function goldFill(y0, y1, o = g) {         // brushed gold foil, light-dark-light bands
  const gr = o.createLinearGradient(0, y0, 0, y1);
  [[0, '#fff3c6'], [.18, '#f7d77c'], [.38, '#d9a43c'], [.52, '#a66c16'], [.58, '#8c5810'], [.66, '#c58c2c'], [.84, '#f3d27a'], [1, '#b27a22']]
    .forEach(([k, col]) => gr.addColorStop(k, col));
  return gr;
}
function rubyFill(y0, y1, o = g) {         // deep red ink for the names on the cloth
  const gr = o.createLinearGradient(0, y0, 0, y1);
  [[0, '#74101c'], [.25, '#a11a2c'], [.55, '#7c0f1c'], [.95, '#4e0810']].forEach(([k, col]) => gr.addColorStop(k, col));
  return gr;
}
function fontStr(c, size, font, opts = {}) {
  const fm = font.match(/^((?:italic\s+)?(?:\d{3}\s+)?)(.*)$/);            // style/weight must come before the size
  return `${fm[1]}${opts.weight || ''} ${size * c.z}px ${fm[2]}`;
}
function measureW(c, str, size, font, opts = {}) {   // width in world units
  g.save(); g.font = fontStr(c, size, font, opts); g.letterSpacing = opts.ls ? `${opts.ls * size * c.z}px` : '0px';
  const w = g.measureText(str).width / c.z; g.restore();
  return w;
}
// world-anchored text (scales with the camera)
function wtext(c, str, x, y, size, font, fill, alpha = 1, opts = {}) {
  if (alpha <= 0) return;
  const [sx, sy] = S(c, x, y), px = size * c.z;
  g.save();
  g.globalAlpha *= alpha;
  g.font = fontStr(c, size, font, opts);
  g.letterSpacing = opts.ls ? `${opts.ls * px}px` : '0px';
  const lx = sx + (opts.ls && (opts.align || 'center') === 'center' ? opts.ls * px / 2 : 0);   // trailing tracking would shift centred text
  g.textAlign = opts.align || 'center'; g.textBaseline = 'alphabetic';
  if (opts.shadow) { g.shadowColor = opts.shadow; g.shadowBlur = px * .25; g.shadowOffsetY = px * .03; }
  if (opts.emboss) {                                         // pressed into plaster: light lower lip, dark upper lip
    g.fillStyle = opts.emboss; g.fillText(str, lx, sy + Math.max(1, px * (opts.embossOff || .03)));
  }
  g.fillStyle = fill === 'gold' ? goldFill(sy - px, sy + px * .2) : fill === 'ruby' ? rubyFill(sy - px * .8, sy + px * .15) : fill;
  if (opts.clipW !== undefined) { g.beginPath(); g.rect(sx - 2000, sy - px * 2, 2000 + opts.clipW * c.z, px * 3); g.clip(); }
  g.fillText(str, lx, sy + (opts.dy || 0) * px);
  if (opts.stroke) { g.shadowColor = 'transparent'; g.lineWidth = Math.max(1, px * .02); g.strokeStyle = opts.stroke; g.strokeText(str, lx, sy); }
  g.restore();
}

/* offscreen layers for reveals: draw into one, mask it, then composite it onto the main canvas */
const LAYERS = [0, 1, 2].map(() => Object.assign(document.createElement('canvas'), { width: W, height: H }));

  if (tBack !== undefined) p = Math.min(p, 1 - ramp(t, tBack, tBack + 1.3, 'inout'));

  const fy = lerp(door.sill, feet, s2);

    const k = E.sine(clamp((p - .45) / .1)), k2 = door.fromSide ? E.sine(clamp((p - .7) / .2)) : k;
    const [ox0, oy0] = S(c, lerp(door.open[0], door.open[0] - (door.fromSide ? 900 : 300), k), door.open[1]), [ox1, oy1] = S(c, lerp(door.open[2], door.open[2] + 300, k2), door.open[3]);

/* a near-camera pillar sweeps across the pan from the doorway to the first window; the couple slips away behind it */
const NEAR_PILLAR = { wx: 2304, par: 4.6, h: 2600 };

function drawNearPillar(t, c) {

function kb(e, t) {                    // gentle Ken Burns per scene; first and last of a day meet the window zoom at scale 1
  const p = clamp((t - e.t0) / (e.t1 - e.t0));

  else if (first) s = 1.07 + .06 * (1 - Math.pow(1 - p, e.kbK || 7));   // carries the fly-through's momentum (kbK sets the start speed), then settles
  else if (last) s = 1.13 - .06 * E.sine(p);                    // ends where the zoom-out picks it up
  else s = 1.03 + .04 * (e.i % 2 ? 1 - p : p);

}
function drawEvent(e, t, clipL, clipR, extra = {}) {

  DAYS.forEach((d, i) => {
    const ev = d.events;
    for (const [tc, night] of [[TL[`zoomIn${i}`][1] - .15, ev[0].sky === 'night'], [TL[`zoomOut${i}`][0] + .55, ev[ev.length - 1].sky === 'night']]) {
      const q = (t - tc + .4) / .8;
      if (q <= 0 || q >= 1) continue;
      const k = Math.pow(Math.sin(q * Math.PI), 1.5) * (night ? .4 : 1);
      const x = lerp(W * 1.05, W * .3, E.inout(q)), y = lerp(H * .02, H * .42, E.inout(q));
      pg.save(); pg.globalCompositeOperation = 'screen';
      let gr = pg.createRadialGradient(x, y, 0, x, y, H * .62);
      gr.addColorStop(0, `rgba(255,200,128,${.42 * k})`); gr.addColorStop(.45, `rgba(255,150,70,${.15 * k})`); gr.addColorStop(1, 'rgba(255,120,40,0)');
      pg.fillStyle = gr; pg.fillRect(0, 0, W, H);
      pg.translate(x, y); pg.scale(7, .07);                // anamorphic streak through the hot spot
      gr = pg.createRadialGradient(0, 0, 0, 0, 0, 160);
      gr.addColorStop(0, `rgba(255,226,180,${.5 * k})`); gr.addColorStop(1, 'rgba(255,200,140,0)');
      pg.fillStyle = gr; pg.beginPath(); pg.arc(0, 0, 160, 0, 7); pg.fill();
      pg.restore();
    }
  });
}
// directional motion blur for fast pans: average a few copies of the frame along the motion
function motionBlur(dx, dy) {
  const o = LAYERS[2].getContext('2d');
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'copy'; o.globalAlpha = 1; o.filter = 'none'; o.drawImage(cv, 0, 0);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  const N = clamp(Math.ceil(Math.hypot(dx, dy) / 2), 8, 24);
  for (let k = 1; k < N; k++) {                            // running average; edges keep the sharp base
    const f = (k % 2 ? 1 : -1) * Math.ceil(k / 2) / (N - 1);
    g.globalAlpha = 1 / (k + 1); g.drawImage(LAYERS[2], dx * f, dy * f);
  }
  g.restore();
}

/* ---------------- main ---------------- */
function inEvents(t) {
  for (const d of DAYS) { const e0 = d.events[0], e1 = d.events[d.events.length - 1]; if (t >= e0.t0 && t < e1.t1) return true; }
  return false;
}
function streetAlpha(t) {
  return 1;     // the camera ends inside the opening, so no cross-fade is needed
  for (let i = 0; i < DAYS.length; i++) {
    const [a0, a1] = TL[`zoomIn${i}`], [b0, b1] = TL[`zoomOut${i}`];
    if (t >= a0 && t < a1) return 1 - ramp(t, a1 - .55, a1 - .02, 'inout');
    if (t >= b0 && t < b1) return ramp(t, b0 + .02, b0 + .5, 'inout');
  }
  return 1;
}
function seek(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  PETAL_KEEP_OUT.length = 0;
  fg.clearRect(0, 0, W, H);
  pg.clearRect(0, 0, W, H);
  if (inEvents(t)) drawEvents(t);
  else {
    const c = camAt(t);
    drawStreet(t, c, streetAlpha(t));
    drawPuppets(t, c);
    drawNearPillar(t, c);
    const c2 = camAt(t + 1 / 30), dx = (c.x0 - c2.x0) * c.z, dy = (c.y0 - c2.y0) * c.z;
    if (Math.abs(c2.z / c.z - 1) < .01 && Math.hypot(dx, dy) > 5) motionBlur(dx * .5, dy * .5);
  }
  // warm vignette for a painted, cinematic finish
  const vg = g.createRadialGradient(W / 2, H * .48, H * .35, W / 2, H * .5, H * .78);
  vg.addColorStop(0, 'rgba(40,12,0,0)'); vg.addColorStop(1, 'rgba(40,12,0,.38)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // fade in from black, out at the end

  petals(t, 26, ramp(t, TL.couple[0] + .6, TL.couple[0] + 1.4) * (1 - ramp(t, TL.couple[1] - .5, TL.toWin0[0] + .2)), 1);
  if (inEvents(t)) petals(t, 16, .55, 2);
  petals(t, 34, ramp(t, TL.end[0], TL.end[0] + 1), 3);
  lightLeak(t);
  seekTexts(t);
  // fade in from black and out at the end (on the top layer, so it covers the titles too)
  const fade = Math.max(1 - ramp(t, 0, .35), ramp(t, DURATION - .6, DURATION));
  if (fade > 0) { fg.fillStyle = `rgba(20,6,2,${fade})`; fg.fillRect(0, 0, W, H); }
}

document.documentElement.lang = LANG;
window.__DURATION = DURATION;
window.__seek = seek;
window.__TL = TL;

const capture = new URLSearchParams(location.search).has('capture');
if (!capture) {
  const fit = () => {
    const st = document.getElementById('stage'), sc = Math.min(innerWidth / W, innerHeight / H);
    st.style.transform = `scale(${sc})`; st.style.marginLeft = ((innerWidth - W * sc) / 2) + 'px';
  };
  fit(); addEventListener('resize', fit);
  const music = document.getElementById('music'), hint = document.getElementById('hint');
  let t0 = null;
  window.__ready.then(() => {
    const loop = now => {
      if (t0 === null) t0 = now;
      let t = music.paused ? (now - t0) / 1000 : music.currentTime;
      if (t > DURATION) { t0 = now; if (!music.paused) music.currentTime = 0; t = 0; }
      seek(t); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    hint.style.display = 'block';
    hint.onclick = () => { hint.style.display = 'none'; music.currentTime = 0; t0 = null; music.play().catch(() => {}); };
  });
} else {
  window.__ready.then(() => seek(0));
}
</script>
